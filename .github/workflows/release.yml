# Builds the CLI and the desktop app for Windows, macOS and Linux.
# Push a tag like v0.1.0 to publish a GitHub Release; run it by hand
# (Actions > release > Run workflow) to get the files as build artifacts only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          # Oldest supported Ubuntu = oldest glibc, so the CLI runs on most distros.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf file

      - name: Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          (cd src-tauri && npx --yes @tauri-apps/cli@2 build --no-bundle)
          mkdir dist
          cp target/release/fang.exe dist/fang-windows-x64.exe
          cp src-tauri/target/release/fang-gui.exe dist/fang-gui-windows-x64.exe

      - name: macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          (cd src-tauri && npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg)
          mkdir dist
          lipo -create -output dist/fang-macos-universal \
            target/aarch64-apple-darwin/release/fang target/x86_64-apple-darwin/release/fang
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/

      - name: Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          (cd src-tauri && npx --yes @tauri-apps/cli@2 build --bundles appimage,deb,rpm)
          mkdir dist
          cp target/release/fang dist/fang-linux-x64
          cp src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fang-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
